[package]
name = "rust-xlsb-writer"

version.workspace = true
edition.workspace = true
rust-version.workspace = true

documentation.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true

keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
jiff = ["dep:jiff"]
rust_decimal = ["dep:rust_decimal"]

[dependencies]
rust-xlsb-core = { path = "../rust-xlsb-core" }
mimalloc = "0.1.52"
thiserror = "^2.0.21"
chrono = { version = "0.4.40", default-features = false, features = ["std"] }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
zip = { version = "~9.7", default-features = false, features = ["deflate-flate2-zlib-rs"] }
jiff = { version = "0.2", optional = true, default-features = false }
rust_decimal = { version = "1.40", optional = true }

[dev-dependencies]
calamine = { version = "^0.38.0", features = ["chrono"] }
criterion = "^0.8"
deku = "^0.20"
rstest.workspace = true
