[workspace]
members = ["rust-xlsb-writer", "rust-xlsb-core"]
resolver = "3"

[workspace.dependencies]
# [x] for parametrized tests
rstest = { version = "^0.28" }

[workspace.package]

version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"

documentation = "https://github.com/SaelKimberly/rust-xlsb-writer"
repository = "https://github.com/SaelKimberly/rust-xlsb-writer"
authors = ["SaelKimberly <sael.kimberly@yandex.ru>"]
license = "Apache-2.0"
readme = "README.md"

keywords = ["data", "xlsb", "excel", "arrow"]
categories = ["encoding"]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -2 }

missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
