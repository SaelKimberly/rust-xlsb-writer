[package]
name = "rust-xlsb-core"

version.workspace = true
edition.workspace = true
rust-version.workspace = true

homepage.workspace = true
documentation.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true

keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
# [x] for reading and writing zip files
zip = { version = "^2.6" }
# [x] for BIFF record content serialization and deserialization
deku = { version = "^0.19" }
# [x] for fast and safe zero-copy conversions
zerocopy = { version = "^0.8" }
# [x] for enum values in debugging
num_enum = { version = "^0.7" }
strum = { version = "^0.27" }
strum_macros = { version = "^0.27" }
# [x] for error handling
thiserror = { version = "^2.0" }
# [x] for fast allocations
bumpalo = { version = "^3.17" }
bumpalo-herd = { version = "^0.1" }
# [x] for test generators
concat-idents = { version = "^1.1" }


[dev-dependencies]
criterion = "^0.5"

[features]
default = []
