[package]
name = "rust-xlsb-core"

version.workspace = true
edition.workspace = true
rust-version.workspace = true

documentation.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true

keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
# [x] for BIFF record content serialization and deserialization
deku = { version = "^0.20" }
# [x] for fast and safe zero-copy conversions
zerocopy = { version = "^0.8.63" }
# [x] for enum values in debugging
num_enum = { version = "^0.7.6" }
strum = { version = "^0.28" }
strum_macros = { version = "^0.28" }
# [x] for error handling
thiserror = { version = "^2.0.21" }
# [x] for test generators
concat-idents = { version = "^1.1.5" }
# [x] for shared strings
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }
rusqlite = { version = "^0.43", features = ["bundled", "rusqlite-macros"] }

[dev-dependencies]
criterion = "^0.8"
rstest.workspace = true

[features]
default = []
